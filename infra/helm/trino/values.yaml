securityContext:
  runAsUser: 1000
  runAsGroup: 1000

shareProcessNamespace:
  coordinator: false
  worker: false

service:
  type: ClusterIP
  port: 8080

auth:
  # Set username and password
  # https://trino.io/docs/current/security/password-file.html#file-format
  # passwordAuth: "username:encrypted-password-with-htpasswd"
  # or set the name of a secret containing this file in the password.db key
  passwordAuthSecret: ""
  # Set users' groups
  # https://trino.io/docs/current/security/group-file.html#file-format
  refreshPeriod: 60s
  groups: ""


serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Annotations to add to the service account
  annotations: { }

secretMounts: [ ]
# - name: sample-secret
#   secretName: sample-secret
#   path: /secrets/sample.json

coordinator:
  jvm:
    maxHeapSize: "4G"
    gcMethod:
      type: "UseG1GC"
      g1:
        heapRegionSize: "32M"

  config:
    memory:
      heapHeadroomPerNode: "1GB"
    query:
      maxMemoryPerNode: "2GB"

  additionalJVMConfig: { }

  additionalExposedPorts: { }

  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 2000m
      memory: 6Gi
    requests:
      cpu: 200m
      memory: 3Gi

  livenessProbe: { }
  # initialDelaySeconds: 20
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 6
  # successThreshold: 1
  readinessProbe: { }
  # initialDelaySeconds: 20
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 6
  # successThreshold: 1

  nodeSelector: { }

  tolerations: [ ]

  affinity: { }

  # Resource groups: Trino's admission-control mechanism. Caps how many
  # queries run at once (per tenant and cluster-wide) and queues the rest
  # instead of admitting
  additionalConfigFiles:
    resource-groups.properties: |
      resource-groups.configuration-manager=file
      resource-groups.config-file=/etc/trino/resource-groups.json
    resource-groups.json: |
      {
        "rootGroups": [
          {
            "name": "global",
            "softMemoryLimit": "90%",
            "hardConcurrencyLimit": 30,
            "maxQueued": 400,
            "schedulingPolicy": "weighted_fair",
            "subGroups": [
              { "name": "superset",  "softMemoryLimit": "50%", "hardConcurrencyLimit": 20, "softConcurrencyLimit": 8, "maxQueued": 300, "schedulingWeight": 6, "schedulingPolicy": "fair" },
              { "name": "ingestion", "softMemoryLimit": "40%", "hardConcurrencyLimit": 5,  "softConcurrencyLimit": 2, "maxQueued": 40,  "schedulingWeight": 2, "schedulingPolicy": "fair" },
              { "name": "adhoc",     "softMemoryLimit": "40%", "hardConcurrencyLimit": 5,  "softConcurrencyLimit": 2, "maxQueued": 20,  "schedulingWeight": 1, "hardCpuLimit": "1h", "schedulingPolicy": "fair" }
            ]
          },
          { "name": "admin", "softMemoryLimit": "100%", "hardConcurrencyLimit": 30, "maxQueued": 300, "schedulingPolicy": "query_priority" }
        ],
        "selectors": [
          { "userGroup": "admin",                "group": "admin" },
          { "userGroup": "giga-superset",         "group": "global.superset" },
          { "userGroup": "giga-ingestion-portal", "group": "global.ingestion" },
          { "userGroup": "giga-trino",            "group": "global.adhoc" },
          { "group": "global.adhoc" }
        ],
        "cpuQuotaPeriod": "1h"
      }

  annotations: { }

  labels: { }

  secretMounts: [ ]
  # - name: sample-secret
  #   secretName: sample-secret
  #   path: /secrets/sample.json

worker:
  jvm:
    maxHeapSize: "6G"
    gcMethod:
      type: "UseG1GC"
      g1:
        heapRegionSize: "32M"

  config:
    memory:
      heapHeadroomPerNode: "1GB"
    query:
      maxMemoryPerNode: "4GB"

  additionalJVMConfig: { }

  additionalExposedPorts: { }

  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 2.0
      memory: 9Gi
    requests:
      cpu: 500m
      memory: 6Gi

  livenessProbe: { }
  # initialDelaySeconds: 20
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 6
  # successThreshold: 1
  readinessProbe: { }
  # initialDelaySeconds: 20
  # periodSeconds: 10
  # timeoutSeconds: 5
  # failureThreshold: 6
  # successThreshold: 1

  nodeSelector: { }

  tolerations: [ ]

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - trino
              - key: component
                operator: In
                values:
                  - worker
          topologyKey: kubernetes.io/hostname

  additionalConfigFiles: { }

  annotations: { }

  labels: { }

  secretMounts: [ ]
  # - name: sample-secret
  #   secretName: sample-secret
  #   path: /secrets/sample.json

