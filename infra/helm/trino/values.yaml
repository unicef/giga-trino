# Default values for trino.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: trinodb/trino
  pullPolicy: Always
  # Overrides the image tag whose default is the chart version.
  # Same value as Chart.yaml#appVersion
  tag: "445"

server:
  workers: 3
  node:
    environment: production
    dataDir: /data/trino
    pluginDir: /usr/lib/trino/plugin
  log:
    trino:
      level: INFO
  config:
    path: /etc/trino
    http:
      port: 8080
    https:
      enabled: false
      port: 8443
      keystore:
        path: ""
    # Trino supports multiple authentication types: PASSWORD, CERTIFICATE, OAUTH2, JWT, KERBEROS
    # For more info: https://trino.io/docs/current/security/authentication-types.html
    authenticationType: "PASSWORD"
    query:
      maxMemory: "8GB"
  exchangeManager:
    name: "filesystem"
    baseDir: "/tmp/trino-local-file-system-exchange-manager"
  workerExtraConfig: ""
  coordinatorExtraConfig: |-
    http-server.authentication.allow-insecure-over-http=true
    http-server.process-forwarded=true
    web-ui.enabled=true
    web-ui.authentication.type=FORM
  autoscaling:
    enabled: false
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  internalSharedSecret: ""

accessControl:
  type: configmap
  refreshPeriod: 60s
  # # Rules file is mounted to /etc/trino/access-control
  configFile: "rules.json"
  rules:
    rules.json: |-
      {
        "catalogs": [
          {
            "group": "admin",
            "catalog": ".*",
            "allow": "all"
          },
          {
            "group": "giga-superset",
            "catalog": ".*",
            "allow": "read-only"
          },
          {
            "group": "giga-dagster",
            "catalog": "delta_lake",
            "allow": "all"
          },
          {
            "group": "giga-trino|giga-ingestion-portal|giga-dagster",
            "catalog": ".*",
            "allow": "read-only"
          }
        ],
        "schemas": [
          {
            "group": "admin",
            "catalog": ".*",
            "schema": ".*",
            "owner": true
          },
          {
            "group": "giga-dagster",
            "catalog": "delta_lake",
            "schema": "default",
            "owner": true
          },
          {
            "group": "giga-trino|giga-superset|giga-ingestion-portal|giga-dagster",
            "catalog": "delta_lake",
            "schema": ".*",
            "owner": false
          },
          {
            "group": "giga-superset",
            "catalog": "delta_lake",
            "schema": "superset",
            "owner": true
          },
          {
            "group": "giga-superset",
            "catalog": "system",
            "schema": ".*"
          }
        ],
        "tables": [
          {
            "user": "giga-admin",
            "catalog": "delta_lake",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "INSERT",
              "DELETE",
              "UPDATE",
              "OWNERSHIP",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "admin",
            "catalog": ".*",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "INSERT",
              "DELETE",
              "UPDATE",
              "OWNERSHIP",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-superset",
            "catalog": "delta_lake",
            "schema": "superset",
            "table": ".*",
            "privileges": [
              "SELECT",
              "INSERT",
              "DELETE",
              "UPDATE",
              "OWNERSHIP",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-superset",
            "catalog": "system",
            "schema": "metadata",
            "table": ".*",
            "privileges": [
              "SELECT"
            ]
          },
          {
            "group": "giga-superset",
            "catalog": "delta_lake",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-dagster",
            "catalog": "delta_lake",
            "schema": "default",
            "table": ".*",
            "privileges": [
              "SELECT",
              "INSERT",
              "DELETE",
              "UPDATE",
              "OWNERSHIP",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-dagster",
            "catalog": "delta_lake",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-trino",
            "catalog": "delta_lake",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-ingestion-portal",
            "catalog": "delta_lake",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "GRANT_SELECT"
            ]
          },
          {
            "group": "giga-trino|giga-dagster|giga-superset",
            "catalog": ".*",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT"
            ]
          }
        ],
        "functions": [
          {
            "group": "admin",
            "catalog": ".*",
            "schema": ".*",
            "function": ".*",
            "privileges": [
              "EXECUTE",
              "GRANT_EXECUTE",
              "OWNERSHIP"
            ]
          },
          {
            "group": "giga-superset|giga-trino|giga-ingestion-portal|giga-dagster",
            "catalog": "delta_lake",
            "schema": ".*",
            "function": ".*",
            "privileges": [
              "EXECUTE",
              "GRANT_EXECUTE"
            ]
          },
          {
            "group": "giga-superset",
            "catalog": "system",
            "schema": "metadata",
            "function": ".*",
            "privileges": [
              "EXECUTE"
            ]
          }
        ],
        "procedures": [
          {
            "group": "admin",
            "catalog": ".*",
            "schema": ".*",
            "procedure": ".*",
            "privileges": [
              "EXECUTE",
              "GRANT_EXECUTE"
            ]
          },
          {
            "group": "giga-superset",
            "catalog": "delta_lake",
            "schema": "superset",
            "procedure": ".*",
            "privileges": [
              "EXECUTE",
              "GRANT_EXECUTE"
            ]
          },
          {
            "group": "giga-superset",
            "catalog": "system",
            "schema": "metadata",
            "procedure": ".*",
            "privileges": [
              "EXECUTE"
            ]
          }
        ],
        "queries": [
          {
            "group": "admin",
            "allow": [
              "execute",
              "kill",
              "view"
            ]
          },
          {
            "group": "giga-superset|giga-trino|giga-ingestion-portal|giga-dagster",
            "allow": [
              "execute",
              "view"
            ]
          }
        ]
      }

additionalNodeProperties: { }

